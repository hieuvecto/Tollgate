global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs: [{ targets: ['alertmanager:9093'] }]
scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ['gateway:3000'] }]
  - job_name: worker
    static_configs: [{ targets: ['worker:3003'] }]
