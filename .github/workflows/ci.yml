name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: tollgate, POSTGRES_PASSWORD: tollgate, POSTGRES_DB: tollgate }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tollgate" --health-interval 2s --health-timeout 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: RUN_INTEGRATION=1 pnpm test
        env:
          DATABASE_URL: postgres://tollgate:tollgate@localhost:5432/tollgate
          REDIS_URL: redis://localhost:6379
      - run: docker build --target gateway --tag tollgate-gateway:ci .
      - run: docker build --target control-plane --tag tollgate-control-plane:ci .
      - run: docker build --target worker --tag tollgate-worker:ci .
